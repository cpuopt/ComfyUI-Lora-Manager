name: Sync upstream

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main

jobs:
  sync:
    if: github.repository == 'cpuopt/ComfyUI-Lora-Manager' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        shell: bash
        run: |
          git fetch --no-tags https://github.com/willmiao/ComfyUI-Lora-Manager.git refs/heads/main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Upstream commits are already present."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit FETCH_HEAD
          git push origin HEAD:refs/heads/main
